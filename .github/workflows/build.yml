name: Build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create GitHub Releases on tags

jobs:
  build:
    env:
      RELEASE_PRERELEASE: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-beta.') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            suffix: macos
            release-files: dist/ModbusConnector.dmg
          - os: windows-latest
            suffix: windows
            release-files: dist/modbus-connector-windows.zip
          - os: ubuntu-latest
            suffix: linux
            release-files: dist/modbus-connector-linux.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libfontconfig1 libxkbcommon0 libdbus-1-3 libgl1

      - name: Create venv and install dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" == "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          "$PY" -m pip install -U pip
          "$PY" -m pip install -e ".[dev,build]"
          "$PY" -m pip install -e ./mcp

      - name: Check release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          "$PY" - <<'PY'
          import os
          import sys
          from modbus_connector import __version__
          ref = os.environ["GITHUB_REF_NAME"]
          expected = f"v{__version__}"
          if ref != expected:
              print(f"Tag {ref} does not match application version {expected}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Advise release tag branch (non-blocking)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          if echo "$TAG" | grep -q -- '-beta.'; then
            PREFERRED=develop
          else
            PREFERRED=main
          fi
          git fetch origin "$PREFERRED" --depth=1
          if git merge-base --is-ancestor HEAD "origin/$PREFERRED"; then
            echo "Tag $TAG is on origin/$PREFERRED history."
          else
            echo "::warning::Tag $TAG is not on origin/$PREFERRED; prefer tagging $PREFERRED for this release type."
          fi

      - name: Run tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        # Per-module processes: a Qt segfault (seen intermittently in long
        # offscreen runs on CI) then fails only its module instead of the
        # whole suite, and the failing module is identified precisely.
        # Exit code 5 = module skipped entirely (Qt-less Linux runner) — OK.
        # A crashed module is retried once in a fresh process (runner flakes);
        # a real regression fails twice and fails the job.
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          for f in tests/test_*.py; do
            code=0
            "$PY" -m pytest "$f" -q --tb=short > test-output.log 2>&1 || code=$?
            cat test-output.log
            if [ $code -eq 0 ] || [ $code -eq 5 ]; then continue; fi
            echo "::warning::$f failed with exit $code — retrying once in a fresh process"
            code=0
            "$PY" -m pytest "$f" -q --tb=short > test-output.log 2>&1 || code=$?
            cat test-output.log
            if [ $code -ne 0 ] && [ $code -ne 5 ]; then
              "$PY" -c 'from pathlib import Path; text=Path("test-output.log").read_text(errors="replace")[-6000:]; print("::error::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
              exit $code
            fi
          done

      - name: Build (macOS/Linux)
        if: runner.os != 'Windows'
        run: ./build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat

      - name: Build and verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          .venv/Scripts/python packaging/windows/build_installer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = .venv/Scripts/python -c "from modbus_connector import __version__; print(__version__)"
          .venv/Scripts/python packaging/windows/verify_installer.py "dist/modbus-connector-$version-windows-x64-setup.exe" --bundle dist/ModbusConnector --version $version

      - name: Upload Windows installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: modbus-connector-windows-installer
          path: dist/*-windows-x64-setup.exe
          if-no-files-found: error

      - name: Setup Flutter (Windows Flutter release)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter Windows bundle
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter --version
          $py = (Resolve-Path .\.venv\Scripts\python.exe).Path
          & $py -m pip install -e .
          & $py -m pip install pyinstaller
          Push-Location flutter_app
          flutter pub get
          flutter build windows --release
          & $py .\tool\build_bridge.py --bundle .\build\windows\x64\runner\Release
          Pop-Location
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path flutter_app\build\windows\x64\runner\Release\* `
            -DestinationPath dist\modbus-flutter-windows.zip -Force

      - name: Upload Flutter Windows artifact
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: modbus-flutter-windows
          path: dist/modbus-flutter-windows.zip
          if-no-files-found: error

      - name: Attach Flutter Windows bundle to GitHub Release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/modbus-flutter-windows.zip
          generate_release_notes: false
          prerelease: ${{ env.RELEASE_PRERELEASE }}

      - name: Attach Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*-windows-x64-setup.exe
          generate_release_notes: false
          prerelease: ${{ env.RELEASE_PRERELEASE }}

      - name: Package AppImage and deb (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          export APPIMAGETOOL=/tmp/appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1  # на раннере нет FUSE
          VERSION=$(.venv/bin/python -c "from modbus_connector import __version__; print(__version__)")
          packaging/linux/make_appimage.sh
          packaging/linux/make_deb.sh "$VERSION"
          # Structural package checks; GUI tests run offscreen before the build.
          dist/ModbusConnector.AppImage --appimage-extract >/dev/null
          test -f squashfs-root/ModbusConnector/ModbusConnector && rm -rf squashfs-root
          dpkg-deb --info "dist/modbus-connector_${VERSION}_amd64.deb" | grep -q "Package: modbus-connector"
          sudo dpkg -i "dist/modbus-connector_${VERSION}_amd64.deb"
          test -L /usr/bin/modbus-connector

      - name: Zip artifact (Windows/Linux)
        if: runner.os != 'macOS'
        shell: pwsh
        run: Compress-Archive -Path dist/ModbusConnector -DestinationPath ${{ matrix.release-files }}

      - uses: actions/upload-artifact@v7
        with:
          name: modbus-connector-${{ matrix.suffix }}
          path: ${{ matrix.release-files }}

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: modbus-connector-cli-${{ matrix.suffix }}
          path: dist-cli/*

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: modbus-connector-linux-packages
          path: |
            dist/ModbusConnector.AppImage
            dist/modbus-connector_*_amd64.deb

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.release-files }}
          generate_release_notes: false
          prerelease: ${{ env.RELEASE_PRERELEASE }}

      - name: Attach CLI binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist-cli/*
          generate_release_notes: false
          prerelease: ${{ env.RELEASE_PRERELEASE }}

      - name: Attach Linux packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/ModbusConnector.AppImage
            dist/modbus-connector_*_amd64.deb
          generate_release_notes: false
          prerelease: ${{ env.RELEASE_PRERELEASE }}

  release-notes:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Summarize commits once after all uploads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 packaging/update_release_notes.py --tag "$RELEASE_TAG"

  publish-pypi:
    # Only the upstream repository owns these PyPI projects and OIDC permissions.
    # Stable tags only — beta builds stay on GitHub prereleases.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-beta.') && github.repository == 'cramen/modbus_connector'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC), no API token needed
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Build MCP subpackage
        run: python -m build mcp --outdir dist-mcp

      - name: Publish MCP subpackage to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-mcp
          skip-existing: true
