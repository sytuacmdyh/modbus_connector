name: Build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    env:
      RELEASE_PRERELEASE: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-beta.') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows
          - os: ubuntu-latest
            suffix: linux
          - os: macos-latest
            suffix: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb
      - uses: subosito/flutter-action@v2
        if: runner.os != 'macOS'
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Create venv and install dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" == "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          "$PY" -m pip install -U pip
          "$PY" -m pip install -e ".[dev,build]" -e ./mcp
      - name: Check release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          "$PY" - <<'PY'
          import os, re
          from pathlib import Path
          from modbus_connector import __version__
          assert os.environ["GITHUB_REF_NAME"] == f"v{__version__}"
          flutter = re.search(r"^version: ([^+\n]+)", Path("flutter_app/pubspec.yaml").read_text(), re.M)[1]
          assert flutter == __version__
          PY
      - name: Test Python backend and headless tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          "$PY" -m pytest tests mcp/tests -q
      - name: Analyze and test Flutter
        if: runner.os != 'macOS'
        working-directory: flutter_app
        run: |
          flutter pub get
          python ../packaging/ci_run.py flutter analyze
          python ../packaging/ci_run.py flutter test
          python ../packaging/ci_run.py dart test test_backend
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build.sh
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat
      - name: Native Windows integration
        if: runner.os == 'Windows'
        working-directory: flutter_app
        shell: pwsh
        run: |
          $env:MODBUS_FLUTTER_HOME = Join-Path $env:RUNNER_TEMP 'modbus-native-acceptance'
          flutter drive --driver=test_driver/native_driver.dart --target=integration_test/desktop_test.dart -d windows --profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter drive --driver=test_driver/native_driver.dart --target=integration_test/parity_test.dart -d windows --profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Linux integration
        if: runner.os == 'Linux'
        working-directory: flutter_app
        run: |
          export MODBUS_FLUTTER_HOME="$(mktemp -d)"
          python ../packaging/ci_run.py xvfb-run -a flutter drive --driver=test_driver/native_driver.dart --target=integration_test/desktop_test.dart -d linux --profile
          python ../packaging/ci_run.py xvfb-run -a flutter drive --driver=test_driver/native_driver.dart --target=integration_test/parity_test.dart -d linux --profile
      - name: Build and verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          .venv/Scripts/python packaging/windows/build_installer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = .venv/Scripts/python -c "from modbus_connector import __version__; print(__version__)"
          .venv/Scripts/python packaging/windows/verify_installer.py "dist/modbus-connector-flutter-$version-windows-x64-setup.exe" --bundle dist/ModbusConnectorFlutter --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Linux AppImage and deb
        if: runner.os == 'Linux'
        run: |
          curl --fail -sSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          export APPIMAGETOOL=/tmp/appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1
          VERSION=$(.venv/bin/python -c "from modbus_connector import __version__; print(__version__)")
          packaging/linux/make_appimage.sh
          packaging/linux/make_deb.sh "$VERSION"
          dist/ModbusConnector.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/ModbusConnector/modbus_desktop
          test ! -e squashfs-root/ModbusConnector/bridge
          rm -rf squashfs-root
          dpkg-deb --info "dist/modbus-connector_${VERSION}_amd64.deb"
      - name: Zip Flutter bundle
        if: runner.os != 'macOS'
        shell: pwsh
        run: Compress-Archive -Path dist/ModbusConnectorFlutter/* -DestinationPath dist/modbus-flutter-${{ matrix.suffix }}.zip
      - uses: actions/upload-artifact@v7
        if: runner.os != 'macOS'
        with:
          name: modbus-flutter-${{ matrix.suffix }}
          path: |
            dist/modbus-flutter-*.zip
            dist/*-windows-x64-setup.exe
            dist/ModbusConnector.AppImage
            dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: modbus-connector-cli-${{ matrix.suffix }}
          path: dist-cli/*
          if-no-files-found: error
      - name: Attach packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/modbus-flutter-*.zip
            dist/*-windows-x64-setup.exe
            dist/ModbusConnector.AppImage
            dist/*.deb
            dist-cli/*
          generate_release_notes: false
          prerelease: ${{ env.RELEASE_PRERELEASE }}

  release-notes:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Summarize commits once after all uploads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 packaging/update_release_notes.py --tag "$RELEASE_TAG"

  publish-pypi:
    # Only the upstream repository owns these PyPI projects and OIDC permissions.
    # Stable tags only — beta builds stay on GitHub prereleases.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-beta.') && github.repository == 'cramen/modbus_connector'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC), no API token needed
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Build MCP subpackage
        run: python -m build mcp --outdir dist-mcp

      - name: Publish MCP subpackage to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-mcp
          skip-existing: true
