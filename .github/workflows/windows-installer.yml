name: Windows installer for existing release

on:
  push:
    branches: [main]
    paths:
      - packaging/windows/**
      - .github/workflows/windows-installer.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (blank uses application version)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-installer-backfill
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download existing release bundle
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          $tag = $env:REQUESTED_TAG
          if (!$tag) {
            $version = python -c "import sys; sys.path.insert(0, 'src'); from modbus_connector import __version__; print(__version__)"
            $tag = "v$version"
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid stable release tag' }
          $zipName = 'modbus-flutter-windows.zip'
          $version = $tag.Substring(1)
          $name = "modbus-connector-flutter-$version-windows-x64-setup.exe"
          $maxAttempts = if ($env:GITHUB_EVENT_NAME -eq 'push') { 30 } else { 5 }
          $delaySeconds = 60
          $release = $null
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            gh api "repos/$env:GH_REPO/releases/tags/$tag" --jq '.' > release.json 2>$null
            if ($LASTEXITCODE -ne 0) {
              if ($attempt -lt $maxAttempts) {
                Write-Host "::notice::Release $tag not found yet (attempt $attempt/$maxAttempts); waiting ${delaySeconds}s"
                Start-Sleep -Seconds $delaySeconds
                continue
              }
              break
            }
            $release = Get-Content release.json -Raw | ConvertFrom-Json
            if ($release.assets.name -contains $name) {
              'skip=true' >> $env:GITHUB_OUTPUT
              exit 0
            }
            if ($release.assets.name -contains $zipName) {
              break
            }
            if ($attempt -lt $maxAttempts) {
              Write-Host "::notice::Release $tag exists but $zipName is not uploaded yet (attempt $attempt/$maxAttempts); waiting ${delaySeconds}s"
              Start-Sleep -Seconds $delaySeconds
              $release = $null
              continue
            }
          }
          if (-not $release) {
            if ($env:GITHUB_EVENT_NAME -eq 'push') {
              Write-Host "::notice::Release $tag is not ready after $maxAttempts attempts; skipping installer backfill on this push."
              'skip=true' >> $env:GITHUB_OUTPUT
              exit 0
            }
            throw 'Release must already exist'
          }
          if ($release.assets.name -notcontains $zipName) {
            if ($env:GITHUB_EVENT_NAME -eq 'push') {
              Write-Host "::notice::Release $tag has no $zipName after waiting; skipping installer backfill on this push."
              'skip=true' >> $env:GITHUB_OUTPUT
              exit 0
            }
            throw "Could not find published asset: $zipName"
          }
          gh release download $tag --pattern $zipName --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the published Windows bundle' }
          $asset = $release.assets | Where-Object name -eq $zipName
          $hash = (Get-FileHash dist/$zipName -Algorithm SHA256).Hash.ToLower()
          if ($asset.digest -and $asset.digest -ne "sha256:$hash") { throw 'Release bundle checksum mismatch' }
          Expand-Archive dist/$zipName -DestinationPath dist/ModbusConnectorFlutter
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
      - name: Build and verify installer
        if: steps.release.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          INSTALLER_NAME: ${{ steps.release.outputs.name }}
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python packaging/windows/build_installer.py --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/windows/verify_installer.py "dist/$env:INSTALLER_NAME" --bundle dist/ModbusConnectorFlutter --version $env:RELEASE_VERSION
      - name: Upload installer without changing release notes
        if: steps.release.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          INSTALLER_NAME: ${{ steps.release.outputs.name }}
        run: gh release upload $env:RELEASE_TAG "dist/$env:INSTALLER_NAME"
