name: Windows installer for existing release

on:
  push:
    branches: [main]
    paths:
      - packaging/windows/**
      - .github/workflows/windows-installer.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (blank uses application version)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-installer-backfill
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download existing release bundle
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:REQUESTED_TAG
          if (!$tag) {
            $version = python -c "import sys; sys.path.insert(0, 'src'); from modbus_connector import __version__; print(__version__)"
            $tag = "v$version"
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid stable release tag' }
          $release = gh api "repos/$env:GH_REPO/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release must already exist' }
          $version = $tag.Substring(1)
          $name = "modbus-connector-$version-windows-x64-setup.exe"
          if ($release.assets.name -contains $name) {
            'skip=true' >> $env:GITHUB_OUTPUT
            exit 0
          }
          gh release download $tag --pattern modbus-connector-windows.zip --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the published Windows bundle' }
          $asset = $release.assets | Where-Object name -eq 'modbus-connector-windows.zip'
          $hash = (Get-FileHash dist/modbus-connector-windows.zip -Algorithm SHA256).Hash.ToLower()
          if ($asset.digest -and $asset.digest -ne "sha256:$hash") { throw 'Release bundle checksum mismatch' }
          Expand-Archive dist/modbus-connector-windows.zip -DestinationPath dist
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
      - name: Build and verify installer
        if: steps.release.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          INSTALLER_NAME: ${{ steps.release.outputs.name }}
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python packaging/windows/build_installer.py --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/windows/verify_installer.py "dist/$env:INSTALLER_NAME" --bundle dist/ModbusConnector --version $env:RELEASE_VERSION
      - name: Upload installer without changing release notes
        if: steps.release.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          INSTALLER_NAME: ${{ steps.release.outputs.name }}
        run: gh release upload $env:RELEASE_TAG "dist/$env:INSTALLER_NAME"
