name: modbus_desktop
description: A native Dart Modbus desktop workbench with Flutter and libserialport.
publish_to: none
version: 0.16.4+9

environment:
  sdk: ^3.13.0

dependencies:
  flutter_localizations:
    sdk: flutter
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_libserialport: ^0.6.0
  crypto: ^3.0.7
  csv: ^8.0.0
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
